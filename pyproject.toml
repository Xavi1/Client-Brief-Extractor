[project]
name = "client-brief-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xavi", email = "xavierkas09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
client-brief-extractor = "client_brief_extractor:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Client Brief Extractor API"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-genai",
    "pydantic",
    "pydantic-settings"
]

# Tell setuptools where to find your app code if you install it
[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v"
testpaths = ["backend/tests"]  # <-- Points pytest to your backend tests folder
pythonpath = ["backend"]       # <-- Ensures 'app' module can be imported cleanly